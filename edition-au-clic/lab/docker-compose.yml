# Laboratoire local de l'édition au clic. Aucune donnée réelle, mots de passe de démonstration uniquement.
name: wpf-edition-au-clic
services:
  db:
    image: mariadb:11.4.12
    environment:
      MARIADB_DATABASE: wp
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp-lab-local
      MARIADB_ROOT_PASSWORD: wp-lab-root
    volumes:
      - dbdata:/var/lib/mysql
  wordpress:
    image: wordpress:7.1.1-php8.4-apache
    depends_on: [db]
    ports:
      - "127.0.0.1:${WPF_LAB_PORT:-8088}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp-lab-local
      WORDPRESS_DB_NAME: wp
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('AUTOMATIC_UPDATER_DISABLED', true);
    volumes:
      - wpdata:/var/www/html
      - ../plugin-wpf-clic:/var/www/html/wp-content/plugins/wpf-clic
  cli:
    image: wordpress:cli-2.12.0-php8.4
    depends_on: [db, wordpress]
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp-lab-local
      WORDPRESS_DB_NAME: wp
    volumes:
      - wpdata:/var/www/html
      - ../plugin-wpf-clic:/var/www/html/wp-content/plugins/wpf-clic
      - ./seed:/seed:ro
    entrypoint: ["wp"]
    profiles: ["cli"]
volumes:
  dbdata:
  wpdata:
